<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دورلي — مساعدك لشراء وبيع وتبديل الآيفون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  ARCHITECTURE NOTES (prototype -> production)
  - This file is a self-contained working prototype (no build step). Data lives in `DB` (in-memory + localStorage).
  - `Backend` = stand-in for server functions (Prisma queries). The AI layer may ONLY recommend what Backend returns.
  - `AIService` = swap point for the Claude API. In production it must be a server route (/api/chat) reading
    ANTHROPIC_API_KEY from an environment variable, using tool-calling limited to Backend.search*/marketEstimate.
    Never put an API key in this frontend file.
  - Entities mirrored in DB: users, sellers(profiles/merchants), listings(devices+specs), verification(level/insp),
    inquiries, complaints. Chat sessions/messages = S.msgs.
-->
<style>
:root{--p:#2563EB;--pd:#1E40AF;--pl:#DBEAFE;--bg:#fff;--bg2:#F8FAFC;--tx:#0F172A;--tx2:#64748B;--bd:#E2E8F0;--ok:#16A34A;--okl:#DCFCE7;--warn:#B45309;--warnl:#FEF3C7;--red:#DC2626;--r:16px;--sh:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins','IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--tx);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased;font-size:16px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.ic{flex:none;vertical-align:middle}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.mut{color:var(--tx2)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:600;font-size:15px;transition:.18s;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--p);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.btn.primary:hover{background:var(--pd);transform:translateY(-1px)}
.btn.ghost{background:#fff;border-color:var(--bd);color:var(--tx)}
.btn.ghost:hover{border-color:var(--p);color:var(--p)}
.btn.soft{background:var(--pl);color:var(--pd)}
.btn.wa{background:#25D366;color:#fff;text-decoration:none}.btn.wa:hover{background:#1ebe5b;transform:translateY(-1px)}
.btn.soft:hover{background:#bfdbfe}
.btn.lg{padding:14px 26px;font-size:17px;border-radius:14px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:#fff;border-color:#fecaca;color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* demo bar */
#demo-bar:empty{display:none}
#demo-bar{background:var(--warnl);color:var(--warn);font-size:13px;text-align:center;padding:6px 12px}
#demo-bar button{text-decoration:underline;font-weight:600;margin-inline-start:8px}
/* header */
#hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hdr-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--pd)}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--pd));display:grid;place-items:center;color:#fff}
.nav{display:flex;gap:4px;margin-inline-start:12px;flex:1}
.nav a{padding:8px 14px;border-radius:10px;color:var(--tx2);font-weight:500;font-size:15px;transition:.15s}
.nav a:hover{background:var(--bg2);color:var(--tx)}
.nav a.on{color:var(--p);background:var(--pl)}
.hdr-act{display:flex;align-items:center;gap:8px}
.burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);place-items:center}
.userchip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:4px 4px 4px 12px;border:1px solid var(--bd);border-radius:999px}
.avatar-s{width:28px;height:28px;border-radius:50%;background:var(--pl);color:var(--pd);display:grid;place-items:center;font-size:13px;font-weight:700}
@media(max-width:860px){
 .burger{display:grid}
 .nav{display:none;position:absolute;top:100%;inset-inline:0;background:#fff;flex-direction:column;padding:10px 20px 16px;border-bottom:1px solid var(--bd);margin:0}
 .nav.open{display:flex}
 .hdr-in{gap:10px}.logo{flex:1}
 .userchip span.nm{display:none}.userchip{padding:4px}
}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:56px 0 40px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--pl);color:var(--pd);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.3;margin:18px 0 14px;font-weight:700;letter-spacing:-.5px}
.grad{background:linear-gradient(90deg,var(--p),#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:19px;color:var(--tx2);max-width:540px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 22px}
.mini-trust{display:flex;gap:18px;flex-wrap:wrap;list-style:none;color:var(--tx2);font-size:14px}
.mini-trust li{display:flex;gap:6px;align-items:center}.mini-trust .ic{color:var(--ok)}
.hero-vis{position:relative;min-height:420px;display:grid;place-items:center}
.hero-vis:before{content:"";position:absolute;inset:6% 4%;background:radial-gradient(circle at 30% 30%,var(--pl),transparent 65%),radial-gradient(circle at 80% 80%,#ede9fe,transparent 60%);border-radius:40px;filter:blur(6px)}
.prev{position:relative;width:min(100%,380px);background:#fff;border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:16px;animation:float 6s ease-in-out infinite}
.prev-h{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.prev .b{padding:9px 13px;border-radius:14px;font-size:14px;margin-bottom:8px;max-width:88%;opacity:0;animation:pop .5s forwards}
.prev .b.bot{background:var(--bg2);border:1px solid var(--bd)}
.prev .b.me{background:var(--p);color:#fff;margin-inline-start:auto}
.prev .mini{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:14px;padding:8px;opacity:0;animation:pop .5s forwards}
.prev .mini svg.ph{width:34px;height:56px}
.chipf{position:absolute;background:#fff;border:1px solid var(--bd);box-shadow:var(--sh);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding-top:32px}.hero-vis{min-height:380px}}
section.sec{padding:44px 0}
.sec h2{font-size:30px;margin-bottom:8px;font-weight:700}
.sec .sub{color:var(--tx2);margin-bottom:26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.svc{padding:24px;text-align:start;transition:.2s;cursor:pointer}
.svc:hover{transform:translateY(-3px);border-color:var(--p)}
.ico-b{width:48px;height:48px;border-radius:14px;background:var(--pl);color:var(--p);display:grid;place-items:center;margin-bottom:14px}
.svc h3{margin-bottom:4px}
.step-n{font-weight:700;color:var(--p);font-size:13px}
/* verification tags */
.vtag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.v1{background:#F1F5F9;color:#475569}.v2{background:#E0F2FE;color:#0369A1}.v3{background:var(--pl);color:var(--pd)}.v4{background:var(--pd);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg2);border:1px solid var(--bd);color:var(--tx2)}
.tag.ok{background:var(--okl);border-color:#bbf7d0;color:#166534}
.tag.mer{background:#EDE9FE;border-color:#DDD6FE;color:#5B21B6}
.tag.warn{background:var(--warnl);border-color:#FDE68A;color:var(--warn)}
/* device card */
.dev{display:flex;flex-direction:column;overflow:hidden;transition:.2s}
.dev:hover{transform:translateY(-3px)}
.dev-img{position:relative;background:linear-gradient(160deg,var(--bg2),#EEF2FF);height:170px;display:grid;place-items:center}
.dev-img svg.ph{height:140px}.dev-img img{height:140px;width:auto;max-width:100%;object-fit:contain;border-radius:10px}
.samp{position:absolute;top:10px;inset-inline-start:10px;font-size:11px;background:var(--warnl);color:var(--warn);padding:1px 8px;border-radius:999px;font-weight:600}
.cmpbox{position:absolute;top:10px;inset-inline-end:10px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:2px 8px;font-size:12px;display:flex;gap:4px;align-items:center;cursor:pointer}
.dev-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.dev-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dev-top h3{font-size:17px}
.price{font-size:22px;font-weight:700;color:var(--pd)}.price small{font-size:13px;color:var(--tx2);font-weight:500}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.seller-l{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tx2);border-top:1px dashed var(--bd);padding-top:8px}
.seller-l b{color:var(--tx)}
.why{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:12px;padding:8px 12px;font-size:13px;color:#075985}
.why ul{margin:4px 18px 0}
.dev-act{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.dev-act .btn{flex:1}
/* chat */
.chat-page{padding-block:18px 30px}
.chat{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);display:flex;flex-direction:column;height:calc(100dvh - 150px);min-height:560px;overflow:hidden}
.chat.min{height:auto;min-height:0}.chat.min .chat-body,.chat.min .chat-prog,.chat.min .chat-in{display:none}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bd)}
.bot-av{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--p),#7c3aed);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.bot-av.s{width:32px;height:32px;border-radius:11px}
.chat-h .nm{font-weight:700;line-height:1.3}
.status{font-size:13px;color:var(--ok);display:flex;align-items:center;gap:6px}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okl)}
.chat-h .sp{flex:1}
.icbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--tx2)}
.icbtn:hover{background:var(--bg2);color:var(--tx)}
.chat-prog{padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;font-size:13px;color:var(--tx2)}
.bar{flex:1;height:6px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#7c3aed);border-radius:99px;transition:width .4s}
.chat-body{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(#fff,#FBFDFF)}
.row{display:flex;gap:10px;align-items:flex-end}
.row.user{justify-content:flex-end}
.row.pop{animation:pop .35s both}
.bub{max-width:min(82%,560px);padding:11px 15px;border-radius:18px;background:var(--bg2);border:1px solid var(--bd);border-end-start-radius:6px;white-space:pre-line}
.row.user .bub{background:var(--p);color:#fff;border-color:var(--p);border-end-start-radius:18px;border-end-end-radius:6px}
.row.wide .bub{max-width:100%;width:100%;background:none;border:0;padding:0}
.editb{opacity:.5;font-size:12px;display:flex;gap:4px;align-items:center;color:var(--tx2);padding:4px 8px;border-radius:8px}
.editb:hover{opacity:1;background:var(--bg2)}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--tx2);opacity:.4;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{40%{opacity:1;transform:translateY(-3px)}}
.opts-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-inline-start:42px;animation:pop .4s both}
.ocard{background:#fff;border:1.5px solid var(--bd);border-radius:16px;padding:16px;text-align:start;transition:.18s;display:flex;flex-direction:column;gap:6px}
.ocard:hover{border-color:var(--p);box-shadow:0 8px 20px rgba(37,99,235,.15);transform:translateY(-2px)}
.ocard .ico-b{margin:0 0 4px}.ocard b{font-size:16px}.ocard span.d{font-size:13px;color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-inline-start:42px;animation:pop .4s both}
.chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--bd);background:#fff;font-weight:500;font-size:15px;transition:.15s}
.chip:hover{border-color:var(--p);background:var(--pl);color:var(--pd)}
.chip.pri{background:var(--p);color:#fff;border-color:var(--p)}.chip.pri:hover{background:var(--pd);color:#fff}
.chip.sec{border-style:dashed;color:var(--tx2)}
.hint{padding-inline-start:42px;font-size:14px;color:var(--tx2);animation:pop .4s both}.hint button{color:var(--p);text-decoration:underline}
.chat-in{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--bd);background:#fff}
.chat-in input{flex:1;border:1.5px solid var(--bd);border-radius:14px;padding:11px 16px;outline:none;background:var(--bg2);min-width:0}
.chat-in input:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 4px var(--pl)}
.send{width:46px;height:46px;border-radius:14px;background:var(--p);color:#fff;display:grid;place-items:center}
.send .ic{transform:scaleX(-1)}
.sumtab{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.sumtab td{padding:8px 14px;border-bottom:1px solid var(--bd)}.sumtab tr:last-child td{border:0}.sumtab td:first-child{color:var(--tx2);width:38%;background:var(--bg2)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;padding-inline-start:42px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
.resgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));padding-inline-start:0;width:100%}
.trade{padding:16px;display:grid;gap:12px;grid-template-columns:1fr auto 1fr;align-items:center}
.trade .sw{display:grid;place-items:center;color:var(--p)}
.trade .box{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:12px;font-size:14px}
.trade .full{grid-column:1/-1}
@media(max-width:640px){.trade{grid-template-columns:1fr}.trade .sw{transform:rotate(90deg)}.opts-cards,.chips,.hint,.thumbs{padding-inline-start:0}.bub{max-width:92%}.row .bot-av{display:none}.chat{height:calc(100dvh - 120px);border-radius:18px}}
/* pages */
.page{padding-block:30px 60px}.page h1{font-size:30px;margin-bottom:6px}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--tx2);font-size:14px;margin-bottom:12px}.crumb:hover{color:var(--p)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;margin:18px 0;background:var(--bg2);border:1px solid var(--bd);border-radius:16px}
.filters label{font-size:13px;color:var(--tx2);display:flex;flex-direction:column;gap:2px}
.filters select{border:1px solid var(--bd);border-radius:10px;padding:7px 10px;background:#fff;min-width:120px}
.filters .chk{flex-direction:row;align-items:center;gap:6px;padding-top:16px;color:var(--tx)}
.cmpbar{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:94vw;background:var(--tx);color:#fff;border-radius:16px;padding:10px 12px 10px 18px;display:flex;gap:14px;align-items:center;z-index:40;box-shadow:0 14px 40px rgba(15,23,42,.35)}
.pc{padding:18px;margin:16px 0}
.pc-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:8px 6px;border-radius:12px;cursor:pointer}
.pc-row:hover{background:var(--bg2)}.pc-row.hl{background:var(--pl)}
.pc-bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden}.pc-bar i{display:block;height:100%;background:var(--p);border-radius:99px}
.pc-row.best .pc-bar i{background:var(--ok)}
@media(max-width:640px){.pc-row{grid-template-columns:1fr auto}.pc-row .pc-bar{grid-column:1/-1;order:3}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:12px 14px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:middle}
.tbl th{background:var(--bg2);color:var(--tx2);font-weight:600;white-space:nowrap}
.tbl td.best{background:var(--okl);font-weight:700}
.scroll-x{overflow-x:auto;border:1px solid var(--bd);border-radius:16px}
.det{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:start}
@media(max-width:860px){.det{grid-template-columns:1fr}}
.det-img{background:linear-gradient(160deg,var(--bg2),#EEF2FF);border-radius:24px;height:380px;display:grid;place-items:center;border:1px solid var(--bd);position:relative}.det-img svg.ph{height:300px}.det-img img{max-height:340px;border-radius:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.kv div{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}.kv small{display:block;color:var(--tx2);font-size:12px}
.vlevels{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vl{display:flex;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;font-size:14px;align-items:flex-start}
.vl.on{background:var(--pl);border-color:#93c5fd}.vl.off{opacity:.55}
.vl .ic{margin-top:3px}
.callout{background:var(--warnl);border:1px solid #FDE68A;color:#78350F;border-radius:12px;padding:10px 14px;font-size:13px;margin-top:12px}
.sbox{padding:16px;display:flex;gap:12px;align-items:center;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.stat{padding:16px}.stat b{font-size:28px;display:block}.stat span{color:var(--tx2);font-size:14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin:16px 0}
.tabs button{padding:10px 16px;font-weight:600;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--p);border-color:var(--p)}
.empty{text-align:center;padding:44px 20px;color:var(--tx2)}
.empty .ico-b{margin:0 auto 12px}
.tbl input,.tbl select,.form input,.form select,.form textarea{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fff;width:100%;outline:none}
.tbl input[type=number]{width:110px}.tbl select{width:auto}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
.form{display:grid;gap:12px}.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rq{color:var(--red)}.hnt{display:block;font-size:12px;color:var(--tx2);font-weight:400}
.lnk{color:var(--p);text-decoration:underline;font-weight:600}
.stepper{display:flex;gap:6px;margin:0 0 20px;overflow-x:auto}
.stepper .st{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--tx2);text-align:center}
.stepper .st i{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-style:normal;font-weight:700;background:#fff}
.stepper .st.on{color:var(--p);font-weight:600}.stepper .st.on i{border-color:var(--p);background:var(--pl);color:var(--pd)}
.stepper .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--bd);border-radius:14px;padding:10px 14px;background:var(--bg2)}

const Backend={
 live(){return DB.listings.filter(pub)},
 marketEstimate(gen,storage){
  const a=this.live().filter(l=>l.gen===gen&&l.variant===''&&l.storage===storage).map(l=>l.price).sort((x,y)=>x-y);
  if(a.length<2)return null;
  const m=a.length%2?a[(a.length-1)/2]:Math.round((a[a.length/2-1]+a[a.length/2])/2);
  return {est:m,n:a.length,min:a[0],max:a[a.length-1]};
 },
 relaxedSearch(c0){
  const c=Object.assign({},c0),notes=[];
  const test=cr=>this.live().filter(l=>(!cr.gen||l.gen===cr.gen)&&(cr.variant==null||l.variant===cr.variant)&&(!cr.storage||l.storage===cr.storage)&&l.price<=cr.max&&(!cr.cond||COND[l.cond].r>=cr.cond)&&l.battery>=cr.bat&&(!cr.seller||sel(l.seller).type===cr.seller));
  const steps=[
   [()=>{if(c.bat)c.bat=0},'خففت شرط البطارية'],
   [()=>{if(c.cond)c.cond=0},'خففت شرط الحالة'],
   [()=>{if(c.max<1e9)c.max=Math.round(c.max*1.15)},'زوّدت الميزانية 15% تقريباً'],
   [()=>{c.seller=null},'وسّعت البحث لتجار وأفراد'],
   [()=>{c.variant=null},'وسّعت البحث لباقي إصدارات الموديل (Pro / Max)'],
   [()=>{c.storage=null},'وسّعت البحث لسعات تخزين تانية']];
  let res=test(c);
  for(const [f,n] of steps){ if(res.length)break; const before=JSON.stringify(c); f(); if(JSON.stringify(c)!==before){notes.push(n);res=test(c)} }
  res.sort((x,y)=>c0.gen?x.price-y.price:(y.level-x.level||y.battery-x.battery||x.price-y.price));
  return {res,notes,crit:c};
 }
};

/* ---- free-text understanding (Egyptian Arabic) ---- */
function parseNum(t,thousandsHint){
 t=toEn(t).replace(/[,،]/g,'');
 let m=t.match(/(\d+(?:\.\d+)?)\s*(الف|ألف|آلاف|ك|k)/i);if(m)return Math.round(parseFloat(m[1])*1000);
 m=t.match(/\d+(?:\.\d+)?/);if(!m)return null;let n=Math.round(parseFloat(m[0]));
 if(thousandsHint&&n>0&&n<1000)n*=1000;return n;
}
function extract(t,pending){
 const x=toEn(t).replace(/[,،]/g,'');const o={gens:[]};
 o.gens=[...x.matchAll(/(?<!\d)(1[1-7])(?!\d)/g)].map(m=>+m[1]);
 if(/برو\s*ماكس|pro\s*max/i.test(x))o.variant='Pro Max';else if(/برو|pro/i.test(x))o.variant='Pro';
 const st=x.match(/(?<!\d)(128|256|512)(?!\d)/);if(st)o.storage=st[1]+'GB';else if(/(1\s*tb|تيرا)/i.test(x))o.storage='1TB';
 let b=x.match(/بطاري\S*\s*(\d{2,3})/)||x.match(/(\d{2,3})\s*%/);if(b&&+b[1]>=40&&+b[1]<=100)o.battery=+b[1];
 else if(pending==='battery'){const n=parseNum(x);if(n&&n>=40&&n<=100)o.battery=n}
 if(/جيد\s*جد/.test(x))o.cond='vgood';else if(/ممتاز|زيرو|نضيف جد/.test(x))o.cond='excellent';else if(/جيد|كويس/.test(x))o.cond='good';
 if(['budget','price','diff'].includes(pending)){const n=parseNum(x,true);if(n!=null)o.money=n}
 else{const m=x.match(/(\d+(?:\.\d+)?)\s*(الف|ألف|آلاف|k|ك)(?![\u0621-\u064A])/i);if(m)o.money=Math.round(parseFloat(m[1])*1000);
  else{const nums=[...x.matchAll(/\d{4,6}/g)].map(m=>+m[0]).filter(n=>n>=3000);if(nums.length)o.money=nums[0];}}
 return o;
}
function applyFree(t){
 const e=AIService.interpret(t,S.pending),J=S.journey,fl=flow(),got={};
 const set=(k,l,v,x)=>{if(fl.includes(k)&&!S.ans[k]){S.ans[k]=Object.assign({l,v},x||{});got[k]=l}};
 if(fl.includes('model')){
  let g=e.gens[0],tg=null;
  if(J==='trade'){if(e.gens.length>=2){g=e.gens[0];tg=e.gens[1]}else if(S.pending==='target'){tg=e.gens[0];g=null}else if(S.pending!=='model'&&!S.ans.model&&e.gens.length===1&&!S.ans.target){}}
  if(g)set('model','iPhone '+g+(e.variant?' '+e.variant:''),g,{variant:e.variant||''});
  if(tg)set('target','iPhone '+tg,tg);
  if(J==='buy'&&S.pending==='model'&&/رشح|مش محدد|اي موديل/.test(t))set('model','مش محدد، رشحلي أنت','any',{variant:''});
 }
 if(e.storage)set('storage',e.storage,e.storage);
 else if(S.pending==='storage'&&J==='buy'&&/مش فارق|اي سعة/.test(t))set('storage','مش فارقة','any');
 if(e.battery!=null)set('battery',e.battery+'%',e.battery);
 if(e.cond)set('condition',COND[e.cond].t,e.cond);
 if(S.pending==='condition'&&J==='buy'&&/مش فارق|المهم السعر/.test(t))set('condition','مش فارقة','any');
 if(e.money!=null){
  const k=J==='buy'?'budget':J==='sell'?'price':'diff';
  if(k==='budget')set(k,'لحد '+fmt(e.money)+' جنيه',[0,e.money]);else set(k,fmt(e.money)+' جنيه',e.money);
 }

}
async function onSend(ev){
 if(ev)ev.preventDefault();
 const inp=$('#cin');const t=(inp.value||'').trim();if(!t||S.typing)return;inp.value='';
 const tk=S.token;
 if(S.pending==='intent'||S.pending==='seller'){
  const k=S.pending;let v=null;
  if(k==='intent'){v=/بدل|تبديل|استبدل/.test(t)?'trade':/بيع|ابيع|أبيع|بيع/.test(t)?'sell':/شراء|اشتري|أشتري|عايز|محتاج|دور/.test(t)?'buy':null}
  else v=/تاجر|محل|معرض/.test(t)?'merchant':/فرد|شخص|حد|مستعمل من/.test(t)?'individual':null;
  if(v){const o=optsFor(k).find(o=>o.v===v);answer(k,t,v);return}
  S.msgs.push({from:'user',text:t});await say('مش متأكد فهمتك 😅 اختار من الكروت اللي تحت أو اكتب بشكل أوضح (مثلاً: عايز أشتري آيفون).');return;
 }
 if(!S.pending){S.msgs.push({from:'user',text:t});renderChat();return}
 if(S.custom){
  const k=S.pending;const n=parseNum(t,k!=='battery');
  S.msgs.push({from:'user',text:t});
  if(n==null||(k==='battery'&&(n<40||n>100))){await say('اكتب الرقم بالأرقام من فضلك 🙏');return}
  S.custom=false;S.msgs.pop();
  if(k==='budget')answer(k,'لحد '+fmt(n)+' جنيه',[0,n]);else if(k==='battery')answer(k,n+'%',n);else answer(k,fmt(n)+' جنيه',n);
  return;
 }
 if(S.pending==='photos'){S.msgs.push({from:'user',text:t});await say('عشان تبعت صور اضغط على زرار "اختار صور" تحت 👇');return}
 const got=applyFree(t);const keys=Object.keys(got);
 S.msgs.push({from:'user',text:t,slots:keys});
 if(keys.length){S.pending=null;renderChat();if(!await say('تمام ✅ سجلت: '+esc(Object.values(got).join(' · '))))return;if(tk!==S.token)return;next()}
 else await say('مش فاهم قصدك بالظبط 🤔 اختار من الاختيارات اللي تحت، أو اكتب بشكل تاني (مثلاً: آيفون 13 128 جيجا لحد 18 ألف).');
}

function whyList(l,c,pool){
 const w=[],s=sel(l.seller);
 if(c.max<1e9&&l.price<=c.max)w.push(`سعره ${fmt(l.price)} جنيه جوه ميزانيتك`);
 const sib=pool.filter(x=>x.gen===l.gen&&x.variant===l.variant&&x.storage===l.storage);
 if(sib.length>=2&&l.price===Math.min(...sib.map(x=>x.price)))w.push(`أرخص عرض من نفس الموديل والسعة (من ${sib.length} عروض)`);
 if(c.bat&&l.battery>=c.bat)w.push(`بطاريته ${l.battery}% أعلى من ${c.bat}% اللي طلبتها`);
 else if(l.battery>=93)w.push(`بطارية قوية (${l.battery}%)`);
 if(l.level>=3)w.push(`${VER[l.level].t} بتاريخ ${l.insp}`);
 const b=topBadge(s);if(b&&!['phone','email'].includes(b))w.push(`البائع: ${BADGES[b]}`);
 return w.slice(0,3);
}

async function hashPw(pw,salt){
 try{const b=new TextEncoder().encode(salt+pw);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 catch(e){let h=5381;for(const c of salt+pw)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}
}
function openLogin(o){
 o=o||{};AFTER=o.after||null;RETURN=o.back||(location.hash.startsWith('#/auth')?'#/':location.hash||'#/');
 AUTH_REASON=o.reason||'';AUTH_ROLE=o.role||null;REG=null;RST=null;closeModal();
 go('#/auth/'+(o.mode||'login'));
}

function afterAuth(){

function showErr(list){const b=$('#rerr');if(!b)return;b.innerHTML=`<div class="err-box"><ul>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;b.scrollIntoView({block:'center',behavior:'smooth'})}
const togglePw=(id,btn)=>{const i=$('#'+id);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'إظهار':'إخفاء'};

function viewAuth(mode){

 const m=['register','reset'].includes(mode)?mode:'login';
 const inner=m==='register'?authReg():m==='reset'?authReset():authLogin();
 const tabs=m==='reset'?'':`<div class="tabs" style="margin-top:0"><button class="${m==='login'?'on':''}" onclick="go('#/auth/login')">تسجيل الدخول</button><button class="${m==='register'?'on':''}" onclick="go('#/auth/register')">إنشاء حساب</button></div>`;
 $('#app').innerHTML=`<div class="wrap page" style="max-width:${m==='register'&&REG&&REG.role?760:640}px"><div class="card" style="padding:26px">${tabs}${AUTH_REASON?`<div class="callout" style="margin:0 0 14px">${esc(AUTH_REASON)}</div>`:''}${inner}</div></div>`;

 return `<h2>أهلاً بيك تاني 👋</h2><p class="mut" style="margin-bottom:14px">ادخل برقم الموبايل أو الإيميل.</p>

async function doLoginForm(ev){
 ev.preventDefault();const id=$('#l_id').value.trim(),pw=$('#l_pw').value,err=m=>{$('#lerr').textContent=m};
 if(LOGIN_FAILS>=5){err('حاولت كتير. استنى دقيقة وجرّب تاني.');return}
 err('');const r=await Cloud.signIn(id,pw,okPhone(id)?normPhone(id):null);
 if(r.error==='disabled'){err('الحساب ده موقوف. تواصل مع الدعم.');return}
 if(r.error){LOGIN_FAILS++;setTimeout(()=>{LOGIN_FAILS=0},60000);err('البيانات مش مظبوطة. اتأكد من الرقم أو الإيميل وكلمة السر.');return}
 LOGIN_FAILS=0;DB=r.db;setSession();toast('أهلاً '+USER.name);afterAuth();
}

function authReset(){
 if(!RST)RST={step:0};
 const back=`<button type="button" class="lnk" onclick="RST=null;go('#/auth/login')">رجوع لتسجيل الدخول</button>`;
 return `<h2>نسيت كلمة السر؟</h2><p class="mut" style="margin-bottom:14px">كلّم فريق دورلي وهنساعدك ترجع لحسابك بعد ما نتأكد إنه بتاعك.</p>${back}`;
 if(RST.step===1)return `<h2>اكتب كود التأكيد</h2><p class="mut">لو الإيميل مسجّل هيوصله كود من 6 أرقام. لو مش لاقيه، بص في الـ Spam.</p><form class="form" onsubmit="resetVerify(event)"><label>الكود<input id="r_otp" inputmode="numeric" maxlength="6" style="letter-spacing:8px;text-align:center;font-size:22px"></label><div id="rerr"></div><button class="btn primary">تأكيد</button><div style="display:flex;gap:10px;align-items:center"><button type="button" class="btn ghost sm" id="rs" onclick="resetSend()" disabled>إعادة إرسال</button><span class="mut" id="rcd"></span></div></form>`;
 return `<h2>كلمة سر جديدة</h2><form class="form" onsubmit="resetSave(event)"><label>كلمة السر الجديدة<div style="position:relative"><input id="r_pw" type="password" autocomplete="new-password" style="padding-inline-end:64px"><button type="button" class="pwt" onclick="togglePw('r_pw',this)">إظهار</button></div><span class="mut" style="font-size:12px;font-weight:400">8 حروف على الأقل، فيها حروف وأرقام.</span></label><label>تأكيد كلمة السر<input id="r_pw2" type="password" autocomplete="new-password"></label><div id="rerr"></div><button class="btn primary">حفظ</button></form>`;
}
async function resetSend(ev){
 if(ev)ev.preventDefault();
 const ph=RST.phone||$('#r_ph').value.trim().toLowerCase();
 if(!okMail(ph)){showErr(['اكتب إيميل صحيح']);return}
 const r=await Cloud.otp({action:'send',email:ph,purpose:'reset'});
 if(r.error){showErr([otpMsg(r.error)]);return}
 RST={step:1,phone:ph,sent:Date.now()};viewAuth('reset');
}
async function resetVerify(ev){
 ev.preventDefault();const v=toEn($('#r_otp').value.trim());
 if(!/^\d{6}$/.test(v)){showErr([otpMsg('code')]);return}
 const r=await Cloud.otp({action:'check',email:RST.phone,code:v,purpose:'reset'});
 if(r.error){showErr([otpMsg(r.error)]);return}
 RST.token=r.token;RST.step=2;viewAuth('reset');
}
async function resetSave(ev){
 ev.preventDefault();const p=$('#r_pw').value,p2=$('#r_pw2').value;
 if(p.length<8||!/\d/.test(p)||!/[A-Za-z\u0600-\u06FF]/.test(p)){showErr(['كلمة السر لازم تكون 8 حروف على الأقل وفيها حروف وأرقام']);return}
 if(p!==p2){showErr(['كلمتين السر مش متطابقين']);return}
 const r=await Cloud.otp({action:'reset',email:RST.phone,token:RST.token,password:p});
 if(r.error){showErr([r.error==='token'?'الكود انتهت صلاحيته. ابدأ من الأول.':'حصلت مشكلة. جرّب تاني.']);return}
 RST=null;toast('كلمة السر اتغيّرت. ادخل بيها دلوقتي.');go('#/auth/login');
}
function startCd(o){
 const src=o||REG;clearInterval(OTPT);
 const tick=()=>{const o2=src.otp||src,left=30-Math.floor((Date.now()-o2.sent)/1000),b=$('#rs');
  if(!b){clearInterval(OTPT);return}
  if(left>0){b.disabled=true;$('#rcd').textContent='تقدر تعيد الإرسال بعد '+left+' ثانية'}else{b.disabled=false;$('#rcd').textContent='';clearInterval(OTPT)}};
 tick();OTPT=setInterval(tick,1000);
}

function readImg(file,max,minSide){
 return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type))return rej('الملف لازم يكون صورة (JPG أو PNG)');
  if(file.size>12*1024*1024)return rej('الصورة أكبر من 12 ميجا');
  const fr=new FileReader();
  fr.onerror=()=>rej('مقدرناش نقرا الصورة');
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej('الصورة تالفة أو مش مدعومة');
   im.onload=()=>{if(Math.min(im.width,im.height)<minSide)return rej('الصورة صغيرة أوي — صوّر بجودة أعلى');
    const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};
   im.src=fr.result};
  fr.readAsDataURL(file);
 });
}

 if(st==='shots')return `<h2>لقطات إعدادات الجهاز</h2><p class="mut" style="margin-bottom:10px">اللقطات دي بتثبت إن البيانات اللي كتبتها حقيقية.</p><div class="callout" style="margin:0 0 12px">${I('lock',14)} <b>خاصة:</b> لقطات الإعدادات بيشوفها فريق المراجعة بس، ومش بتظهر للمشترين. بعد مطابقتها بالبيانات المكتوبة، الإعلان بياخد مستوى «البيانات متراجعة». ده مش اختبار أو فحص فني للجهاز.</div>
  <div class="slots">${SHOT_SLOTS.map(s=>slotCard('shots',s)).join('')}</div>
  <div class="form" style="margin-top:14px">${pchk('shotsOk',`أؤكد إن <b>صحة البطارية (${esc(d.battery||'—')}%)</b> و<b>الموديل والسعة (iPhone ${esc(d.gen||'—')}${d.variant?' '+esc(d.variant):''} · ${esc(d.storage||'—')})</b> مطابقين للقطات. <span class="rq">*</span>`)}</div>${pubNav()}`;
 if(st==='review'){
  const est=d.gen&&d.storage?Backend.marketEstimate(+d.gen,d.storage):null,ph=PHOTO_SLOTS.filter(s=>PUB.photos[s[0]]),sh=SHOT_SLOTS.filter(s=>PUB.shots[s[0]]);
  const rows=[['الجهاز',`iPhone ${d.gen}${d.variant?' '+d.variant:''} · ${d.storage} · ${d.color}`],['البطارية والحالة',`${d.battery}% · ${COND[d.cond].t}`],['القطع المتغيرة',partsTxt(d)],['العيوب',defTxt(d)],['المشتملات',d.acc.length?d.acc.map(k=>ACC_O.find(a=>a[0]===k)[1]).join('، '):'مفيش'],['الضمان',WAR_T[d.warranty]+(d.warranty==='shop'?' ('+d.wMonths+' شهر)':'')],['الشبكة',NET_T[d.network]],['iCloud','مسجّل خروج (إقرار البائع)']];
  return `<h2>السعر والنشر</h2><p class="mut" style="margin-bottom:12px">راجع كل حاجة قبل ما تنشر.</p>
  <table class="sumtab">${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
  <div class="meta" style="margin:12px 0">${ph.map(s=>`<img src="${PUB.photos[s[0]]}" alt="${s[1]}" title="${s[1]}" style="width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in" onclick="viewImg(this.src)">`).join('')}</div>
  <div class="hnt" style="margin-bottom:12px">${ph.length} صور للجهاز (عامة) · ${sh.length} لقطات إعدادات (خاصة)</div>
  <div class="form">${pfld('price','السعر المطلوب (جنيه)',{req:1,type:'number',attr:'min="1000"',hint:est?`للمقارنة: متوسط المعروض لنفس الموديل والسعة حوالي ${fmt(est.est)} جنيه (من ${est.n} إعلانات، من ${fmt(est.min)} لـ ${fmt(est.max)}).`:'مفيش إعلانات كفاية لنفس الموديل والسعة عشان أقدّر لك سعر مقارنة.'})}
  ${pfld('whatsapp','رقم واتساب للتواصل',{req:1,type:'tel',ph:'01XXXXXXXXX',attr:'inputmode="tel" dir="ltr" style="text-align:start"',hint:`${I('lock',12)} المشترين بيكلّموك عليه من زرار «واتساب» في الإعلان (لازم يكونوا عاملين حساب). الرقم نفسه مش بيتعرض في الإعلان.`})}
  ${pchk('nego','السعر قابل للتفاوض')}${mer&&!PUB.replace?pchk('again','عايز أضيف جهاز تاني بعد النشر'):''}
  ${pchk('decl','أقرّ إن كل البيانات والصور حقيقية للجهاز المعروض، وإني فاهم إن الإعلان بيتراجع قبل النشر وممكن يترفض. <span class="rq">*</span>')}</div>${pubNav(1)}`;
 }
 return '';
}
function renderPublish(){
 const st=PUB_STEPS[PUB.step][0];
 const stepper=`<div class="stepper">${PUB_STEPS.map((s,i)=>`<div class="st ${i<PUB.step?'done':i===PUB.step?'on':''}"><i>${i<PUB.step?'✓':i+1}</i><span>${s[1]}</span></div>`).join('')}</div>`;
 $('#app').innerHTML=`<div class="wrap page" style="max-width:820px"><a class="crumb" href="#/dashboard">${I('back',14)} لوحة البيع</a><h1>${PUB.replace?'تعديل وإعادة إرسال الإعلان':'نشر جهاز جديد'}</h1><p class="mut" style="margin-bottom:14px">كل الحقول المعلّمة بـ <span class="rq">*</span> إجبارية، والصور ولقطات الإعدادات لازم تتحط قبل النشر.</p><div class="card" style="padding:24px">${stepper}${pubStepHtml(st)}</div></div>`;
}
function viewPublish(){
 if(!USER||!['merchant','individual'].includes(USER.role))return gate('نشر جهاز','لازم حساب بائع (تاجر أو بائع حر) عشان تنشر جهاز.');
 if(PUBDONE&&!PUB)return renderPubDone();
 if(!PUB)PUB=newPub();
 if(USER.role==='individual'&&myCountExcept(PUB.replace)>=1){$('#app').innerHTML=`<div class="wrap page"><div class="card empty"><div class="ico-b">${I('phone',24)}</div><h3>عندك إعلان شغال بالفعل</h3><p>حساب الفرد بيعرض جهاز واحد في المرة. علّم الإعلان الحالي "اتباع" عشان تنشر جهاز تاني.</p><br><button class="btn primary" onclick="go('#/dashboard')">لوحة البيع</button></div></div>`;return}
 renderPublish();
}
function pubPublish(){
 const order=PUB_STEPS.map(s=>s[0]);
 for(let i=0;i<order.length;i++){const e=pubValidate(order[i]);if(e.length){PUB.step=i;renderPublish();showErr(e);return}}
 if(USER.role==='individual'&&myCountExcept(PUB.replace)>=1){toast('حساب الفرد بيعرض جهاز واحد في المرة');return}
 const d=PUB.d;d.whatsapp=normPhone(d.whatsapp||'');
 const old=PUB.replace?byId(PUB.replace):null;
 if(PUB.replace)DB.listings=DB.listings.filter(l=>l.id!==PUB.replace);
 const l={id:old?old.id:'L'+Date.now(),wa:true,pay:old&&old.pay?old.pay:{amount:LISTING_FEE,currency:'EGP',status:'unpaid'},gen:/^\d+$/.test(d.gen)?+d.gen:d.gen,variant:d.variant,storage:d.storage,battery:+d.battery,cond:d.cond,price:+d.price,seller:USER.sellerId,level:1,color:d.color,status:'pending',sample:false,insp:null,
  parts:partsTxt(d),defects:defTxt(d),acc:d.acc.slice(),warranty:WAR_T[d.warranty]+(d.warranty==='shop'?' ('+d.wMonths+' شهر)':''),network:NET_T[d.network],icloud:true,nego:!!d.nego,date:'نوفمبر 2026',
  form:Object.assign({},d,{acc:d.acc.slice()}),pubPhotos:Object.assign({},PUB.photos),shots:Object.assign({},PUB.shots)};
 DB.listings.unshift(l);save();PUBDONE={l,again:!!d.again};PUB=null;
 if(PUBDONE.again){toast('اتبعت للمراجعة ✅ — ابدأ الجهاز التالي');PUB=newPub();PUBDONE=null;renderPublish();window.scrollTo(0,0);return}
 renderPubDone();window.scrollTo(0,0);
}
function renderPubDone(){
 const l=PUBDONE.l;
 $('#app').innerHTML=`<div class="wrap page" style="max-width:640px"><div class="card" style="padding:28px;text-align:center"><div class="ico-b" style="margin:0 auto 12px;background:var(--okl);color:var(--ok)">${I('check',26)}</div><h2>${isUnpaid(l)?'إعلانك اتسجّل — فاضل الدفع':'اتبعت للمراجعة ✅'}</h2><p class="mut" style="margin:6px 0 14px">${nm(l)} · ${l.storage} · ${fmt(l.price)} جنيه</p>
 ${isUnpaid(l)?`<div class="card" style="padding:16px;margin-bottom:14px"><b>رسوم النشر: ${fmt(l.pay.amount)} جنيه</b><div class="mut" style="margin:4px 0 10px">الإعلان بيدخل المراجعة ويظهر للمشترين بعد الدفع.</div><button class="btn primary" onclick="startPayment('${l.id}')">ادفع ${fmt(l.pay.amount)} جنيه</button></div>`:''}
 <div class="vlevels" style="text-align:start"><div class="vl on">${I('check',16)}<div><b>اتسجّلت كل البيانات</b><div class="mut">${lphotos(l).length} صور للجهاز و${lshots(l).length} لقطات إعدادات.</div></div></div><div class="vl">${I('lock',16)}<div><b>الخطوة الجاية: مراجعة</b><div class="mut">فريق المراجعة بيطابق بياناتك بلقطات الإعدادات وبعدين الإعلان يظهر للمشترين بمستوى «البيانات متراجعة». لو فيه مشكلة هتلاقي السبب في لوحتك وتعدّل وتبعت تاني.</div></div></div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:center"><a class="btn primary" href="#/dashboard">لوحة البيع</a><a class="btn ghost" href="#/device/${l.id}">شوف الإعلان</a>${USER.role==='merchant'?`<button class="btn ghost" onclick="PUBDONE=null;openAdd()">انشر جهاز تاني</button>`:''}</div></div></div>`;
}

/* =========================================================
   Header, router, boot
   ========================================================= */
let MENU=false;
function toggleMenu(){MENU=!MENU;renderHeader()}
function go(h){MENU=false;if(location.hash===h)route();else location.hash=h}
function renderHeader(){
 const p=(location.hash.replace(/^#\/?/,'')||'').split('/');
 const key=p[0]==='chat'?(p[1]||S.journey||'chat'):p[0]||'home';
 const L=[['#/','الرئيسية','home'],['#/chat/buy','شراء آيفون','buy'],['#/chat/sell','بيع موبايلك','sell'],['#/chat/trade','تبديل','trade'],['#/about','عن المنصة','about']];
 const dash=USER&&(USER.role!=='customer'?`<a class="btn soft sm" href="#/dashboard">لوحتي</a>`:'');
 $('#hdr').innerHTML=`<div class="hdr-in"><a class="logo" href="#/"><span class="logo-mark">${I('search',20)}</span><span>دورلي</span></a>
 <nav class="nav ${MENU?'open':''}">${L.map(l=>`<a href="${l[0]}" class="${key===l[2]?'on':''}" onclick="MENU=false">${l[1]}</a>`).join('')}</nav>
 <div class="hdr-act">${USER?`${dash}<div class="userchip"><span class="nm">${esc(USER.name)}</span><span class="avatar-s">${esc(USER.name[0])}</span></div><button class="icbtn" title="خروج" onclick="logout()">${I('x',16)}</button>`:`<button class="btn primary sm" onclick="openLogin({})">${I('user',15)} دخول / تسجيل</button>`}<button class="burger" onclick="toggleMenu()" aria-label="القائمة">${I('menu')}</button></div></div>`;
 $('#demo-bar').innerHTML='';
}
function setDemo(v){DEMO=v;LS.set('dorly_demo',v);route()}
function route(){
 const parts=(location.hash.replace(/^#\/?/,'')||'').split('/'),p=parts[0],a=parts[1];
 renderHeader();
 if(p==='admin'){location.replace('admin.html');return}
 if(p==='chat')viewChat(a);
 else if(p==='results')viewResults();
 else if(p==='compare')viewCompare();
 else if(p==='device')viewDevice(a);
 else if(p==='seller')viewSeller(a);
 else if(p==='dashboard')viewDash();
 else if(p==='auth')viewAuth(a);
 else if(p==='publish')viewPublish();
 else if(p==='about')viewAbout();
 else viewHome();
 if(!NOSCROLL&&p!=='chat')window.scrollTo(0,0);
 NOSCROLL=false;
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(async function boot(){
 $('#app').innerHTML='<div class="wrap page"><p class="mut" style="text-align:center;padding:60px 0">جاري التحميل…</p></div>';
 try{DB=await Cloud.load();setSession();if(Cloud.disabledNotice)toast('الحساب ده موقوف. تواصل مع الدعم.')}
 catch(e){console.error(e);toast('مشكلة في الاتصال — جرّب تحدّث الصفحة')}
 route();
})();
</script>
